[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "betterlinuxcnc-service"
version = "0.1.0"
description = "Local diagnostics-only service for the BetterLinuxCNC desktop"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
betterlinuxcnc-service = "betterlinuxcnc_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
