# vim: sw=2

name: Build CI

on:
  push:
    branches: [main, staging测试环境]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read #  to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Replace obsolete CI runs, but never interrupt a test-machine deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging测试环境' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A failed dependency must fail the required check, not skip it.
    if: ${{ always() }}
    needs:
      - package-arch
    steps:
    - name: Require all build and test jobs to pass
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        results = json.loads(os.environ["NEEDS_JSON"])
        for name, job in results.items():
            print(f"{name}: {job['result']}")
        sys.exit(0 if results and all(
            job["result"] == "success" for job in results.values()
        ) else 1)
        PY

  package-arch:
    name: Debian 13 x86 build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: debian:trixie
      # IPC_OWNER is needed for shmget IPC_CREAT
      # SYS_ADMIN is needed for shmctl IPC_SET
      options: --cap-add=IPC_OWNER --cap-add=SYS_ADMIN
    steps:
    - name: Install pre-dependencies
      run: |
        set -x
        apt-get -q -o Acquire::http::No-Cache=true -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
        # Install stuff needed to check out the linuxcnc repo and turn it into a debian source package and run tests.
        apt-get --yes --no-install-recommends install curl git lsb-release python3 devscripts sudo adduser xauth
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false
        # "fetch-depth: 0" fetches all of history, this is needed by
        # our build system to determine the version from tags
        fetch-depth: 0
    - name: Git config
      run: |
        set -x
        git config --global --add safe.directory "$PWD"
    - name: Check package versions with and without release tags
      run: python3 .github/scripts/test-package-version.py
    - name: Build architecture-specific Debian packages
      env:
        DEBEMAIL: emc-developers@lists.sourceforge.net
        DEBFULLNAME: LinuxCNC Github CI Robot
      run: |
        set -x
        .github/scripts/build-package-arch.sh
    - name: Verify no untracked or modified files after build
      run: |
        .github/scripts/verify-clean-repo.sh ':(exclude)VERSION' ':(exclude)debian/changelog'
    # Runtime acceptance belongs to the test branch, after merge.
    # PRs and main only compile and package the code.
    - name: Install debian packages
      if: >-
        github.ref == 'refs/heads/staging测试环境' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        set -x
        apt-get --yes --no-install-recommends install ../*.deb
    - name: Test debian packages
      if: >-
        github.ref == 'refs/heads/staging测试环境' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        set -x
        adduser --disabled-password --gecos "" testrunner
        passwd -d testrunner
        adduser testrunner sudo
        chmod 0777 $(find tests/ -type d) # make test dirs world-writable for the testrunner
        su -c "./scripts/runtests -p ./tests" testrunner
    - name: Verify no untracked or modified files after test
      if: >-
        github.ref == 'refs/heads/staging测试环境' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        .github/scripts/verify-clean-repo.sh ':(exclude)VERSION' ':(exclude)debian/changelog'
    - name: Gather Debian 13 packages
      run: |
        test "$(dpkg --print-architecture)" = amd64
        mkdir -p artifacts
        cp ../*.deb artifacts/
        (cd artifacts && sha256sum *.deb > SHA256SUMS.txt)
    - name: Upload Debian 13 packages
      uses: actions/upload-artifact@v7
      with:
        name: linuxcnc-trixie-amd64
        path: artifacts/
        if-no-files-found: error

  deploy-staging:
    name: Deploy and test staging
    needs: ci-gate
    if: >-
      github.repository == 'Xamber-Software/BetterLinuxCNC' &&
      github.ref == 'refs/heads/staging测试环境' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: betterlinuxcnc-staging-deploy
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: linuxcnc-trixie-amd64
        path: staging-artifact
    - name: Deploy the tested Debian 13 package through FRP
      env:
        STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        STAGING_HOST: ${{ vars.STAGING_HOST || '45.192.97.209' }}
        STAGING_PORT: ${{ vars.STAGING_PORT || '39011' }}
        STAGING_USER: deploy
      run: .github/staging/deploy.sh staging-artifact
