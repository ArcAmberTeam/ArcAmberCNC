# 烛龙 V2 XYZ 低速调试配置，基于用户提供的六轴参考配置。
# 仅静态验证；实际引脚、运动方向、驱动时序、机械行程尚未实机验收。
# 1600 pulse/rev / 5 mm/rev = 320 pulse/mm。2.84 A 在驱动器上设置。
# 软限位假设：X/Y 零点在负端向内5mm处；Z零点在顶端向下5mm处。
# 按总行程各端预留5mm：X 0..265，Y 0..410，Z -80..0；必须实测确认。

[EMC]
MACHINE = Zhulong V2 XYZ - Manual Home
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = gmoccapy
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
PROGRAM_PREFIX = ./nc_files
INCREMENTS = 1mm .1mm .01mm
DEFAULT_LINEAR_VELOCITY = 1.0
MIN_LINEAR_VELOCITY = 0.1
MAX_LINEAR_VELOCITY = 5.0
MAX_FEED_OVERRIDE = 1.0
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.0
GEOMETRY = XYZ
CYCLE_TIME = 100

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G49 G80 G90 G94 G97 G64 P0.025

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
CARD0 = hm2_7i92.0

[HAL]
HALUI = halui
HALFILE = zhulong-xyz.hal
HALFILE = custom.hal
POSTGUI_HALFILE = gmoccapy_postgui.hal

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 5.0
MAX_LINEAR_ACCELERATION = 50.0
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# X: Joint 0 -> AXIS2 -> stepgen.02
[AXIS_X]
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 50.0
MIN_LIMIT = 0.0
MAX_LIMIT = 265.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 50.0
STEPGEN_MAXVEL = 6.25
STEPGEN_MAXACCEL = 62.5
FERROR = 1.0
MIN_FERROR = 0.25
P = 1000.0
I = 0.0
D = 0.0
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = 0.0
MAX_OUTPUT = 0.0
# 时序沿用厂家参考：方向10us，脉冲高/低各5us；需核对驱动器手册。
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
STEP_SCALE = 320.0
MIN_LIMIT = 0.0
MAX_LIMIT = 265.0
# 人工定位后按回零：当前位置记为0，不搜索开关、不自动移动。
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 0

# Y: Joint 1 -> AXIS0 -> stepgen.00
[AXIS_Y]
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 50.0
MIN_LIMIT = 0.0
