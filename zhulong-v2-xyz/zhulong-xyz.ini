MAX_OUTPUT = 0.0
# 时序沿用厂家参考：方向10us，脉冲高/低各5us；需核对驱动器手册。
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
STEP_SCALE = 320.0
MIN_LIMIT = 0.0
MAX_LIMIT = 410.0
# 人工定位后按回零：当前位置记为0，不搜索开关、不自动移动。
HOME = 0.0
