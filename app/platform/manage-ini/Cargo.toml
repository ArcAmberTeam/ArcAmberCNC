[package]
name = "betterlinuxcnc-manage-ini"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-2.0-or-later"
description = "Restricted PA maintenance terminal entry points"

[[bin]]
name = "pa"
path = "src/main.rs"

[dependencies]
libc = "=0.2.191"
unicode-width = { version = "=0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "pa-config"
path = "src/config_main.rs"

[dev-dependencies]
tempfile = "3"
