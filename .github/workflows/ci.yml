# vim: sw=2

name: Build CI

on:
  push:
    branches: [main, staging测试环境]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy this branch to the shared test VM after all checks pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read #  to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_staging && 'deploy' || 'ci' }}
  # Replace obsolete CI runs, but never interrupt a test-machine deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging测试环境' && !(github.event_name == 'workflow_dispatch' && inputs.deploy_staging) }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  ci-gate:
    name: CI Gate
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 5
    # A failed dependency must fail the required check, not skip it.
    if: ${{ always() }}
    needs:
      - package-arch
      - source-checks
      - axis-assets
      - interpreter-regressions
    steps:
    - name: Require all build and test jobs to pass
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        results = json.loads(os.environ["NEEDS_JSON"])
        for name, job in results.items():
            print(f"{name}: {job['result']}")
        sys.exit(0 if results and all(
            job["result"] == "success" for job in results.values()
        ) else 1)
        PY

  source-checks:
    name: Workflow and source checks
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check workflows, maintained shell scripts, Python and renderer syntax
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: .github/ci/check-source.sh

  axis-assets:
    name: AXIS GIF and Tk checks
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Check all toolbar images with the actual Tk image loader
      run: xvfb-run -a python3 .github/ci/check-icons.py

  interpreter-regressions:
    name: G-code interpreter regressions
    needs: package-arch
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: linuxcnc-trixie-amd64
        path: checked-artifact
    - name: Extract and check the same-run artifact without installing it
      run: |
        .github/ci/prepare-image.sh
        container="betterlinuxcnc-regressions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
        docker run --rm --init --name "$container" --network=none \
          --cpus=4 --memory=2g --memory-swap=2g \
          --tmpfs /work:rw,exec,size=512m --workdir /work \
          --mount "type=bind,src=$PWD,dst=/source,readonly" \
          --mount "type=bind,src=$PWD/checked-artifact,dst=/artifact,readonly" \
          betterlinuxcnc-ci:trixie bash /source/.github/ci/check-interpreter.sh

  package-arch:
    name: Debian 13 x86 build
    # Only trusted same-repository PRs may execute on our persistent runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 35
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false
        fetch-depth: 0
        persist-credentials: false
    - name: Build Debian 13 packages in a clean cached container
      env:
        RUN_ACCEPTANCE: >-
          ${{ (github.ref == 'refs/heads/staging测试环境' &&
               (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
              (github.event_name == 'workflow_dispatch' && inputs.deploy_staging &&
               startsWith(github.ref, 'refs/heads/')) }}
      run: |
        mode=build
        if [ "$RUN_ACCEPTANCE" = true ]; then mode=test; fi
        .github/ci/run.sh "$mode"
    - name: Upload Debian 13 packages
      uses: actions/upload-artifact@v7
      with:
        name: linuxcnc-trixie-amd64
        path: artifacts/
        if-no-files-found: error

  deploy-staging:
    name: Deploy and test staging
    needs: ci-gate
    if: >-
      github.repository == 'Xamber-Software/BetterLinuxCNC' &&
      startsWith(github.ref, 'refs/heads/') &&
      ((github.ref == 'refs/heads/staging测试环境' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_staging))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: betterlinuxcnc-staging-deploy
      cancel-in-progress: false
    steps:
    - name: Record the selected branch and exact commit
      env:
        DEPLOY_REF: ${{ github.ref_name }}
        DEPLOY_SHA: ${{ github.sha }}
      run: |
        printf 'Test environment request: branch `%s`, commit `%s`.\n' \
          "$DEPLOY_REF" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: linuxcnc-trixie-amd64
        path: staging-artifact
    - name: Deploy the tested Debian 13 package through FRP
      env:
        STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        STAGING_HOST: ${{ vars.STAGING_HOST || '45.192.97.209' }}
        STAGING_PORT: ${{ vars.STAGING_PORT || '39011' }}
        STAGING_USER: deploy
      run: .github/staging/deploy.sh staging-artifact
