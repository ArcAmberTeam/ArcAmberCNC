# vim: sw=2

name: Full compatibility CI

on:
  workflow_dispatch:

permissions:
  contents: read #  to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Replace obsolete CI runs, but never interrupt a test-machine deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging测试环境' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  rip-and-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo Number of CPUs: $(nproc)
        echo "$GITHUB_CONTEXT"
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false
        fetch-depth: 1
    - name: Install dependencies
      run: |
        set -x
        .github/scripts/install-deps.sh
    - name: Check package versions with and without release tags
      run: python3 .github/scripts/test-package-version.py
    - name: Build RIP GCC
      run: |
        set -x
        .github/scripts/build-rip.sh --with-realtime=uspace
    - name: Verify no untracked or modified files after build
      run: |
        .github/scripts/verify-clean-repo.sh
    - name: Test
      run: |
        set -x
        scripts/rip-environment runtests -p
    - name: Verify no untracked or modified files after test
      run: |
        .github/scripts/verify-clean-repo.sh

  rip-rtai:
    runs-on: ubuntu-24.04
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo Number of CPUs: $(nproc)
        echo "$GITHUB_CONTEXT"
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false
        fetch-depth: 1
    - name: Install dependencies
      run: |
        set -x
        .github/scripts/install-rtai.sh trixie
        .github/scripts/install-deps.sh
    - name: Build RIP RTAI
      run: |
        set -x
        .github/scripts/build-rip.sh --with-realtime=/usr/realtime-*
    - name: Verify no untracked or modified files after build
      run: |
        .github/scripts/verify-clean-repo.sh

  rip-and-test-clang:
    runs-on: ubuntu-24.04
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo Number of CPUs: $(nproc)
        echo "$GITHUB_CONTEXT"
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false
        fetch-depth: 1
    - name: Install dependencies
      run: |
        set -x
        .github/scripts/install-deps.sh
    - name: Build RIP Clang
      run: |
        set -x
        CC=clang CXX=clang++ .github/scripts/build-rip.sh --with-realtime=uspace
    - name: Verify no untracked or modified files after build
      run: |
        .github/scripts/verify-clean-repo.sh
    - name: Test
      run: |
        set -x
        scripts/rip-environment runtests -p
    - name: Verify no untracked or modified files after test
      run: |
        .github/scripts/verify-clean-repo.sh

