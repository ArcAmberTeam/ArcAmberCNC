name: Full compatibility CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.suite }} / ${{ matrix.dist }}
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 120
    continue-on-error: ${{ matrix.dist == 'sid' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {suite: gcc, dist: trixie}
          - {suite: clang, dist: trixie}
          - {suite: rtai, dist: trixie}
          - {suite: html, dist: trixie}
          - {suite: package-arch, dist: bullseye}
          - {suite: package-arch, dist: bookworm}
          - {suite: package-arch, dist: trixie}
          - {suite: package-arch, dist: sid}
          - {suite: package-indep, dist: bullseye}
          - {suite: package-indep, dist: bookworm}
          - {suite: package-indep, dist: trixie}
          - {suite: package-indep, dist: sid}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Build and test in a disposable Debian container
      env:
        SUITE: ${{ matrix.suite }}
        DIST: ${{ matrix.dist }}
      run: .github/ci/compatibility.sh "$SUITE" "$DIST"
    - name: Upload compatibility artifact
      if: matrix.suite == 'html' || startsWith(matrix.suite, 'package-')
      uses: actions/upload-artifact@v7
      with:
        name: compatibility-${{ matrix.suite }}-${{ matrix.dist }}
        path: compat-artifacts/${{ matrix.suite }}/${{ matrix.dist }}/
        if-no-files-found: error
