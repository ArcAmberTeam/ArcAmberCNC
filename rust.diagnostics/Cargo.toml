[package]
name = "betterlinuxcnc-socket"
version = "0.1.0"
description = "BetterLinuxCNC local diagnostics socket transport"
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.97"

[lib]
name = "betterlinuxcnc_socket"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
