# vim: sw=2

name: Build CI

on:
  push:
    branches: [main, staging测试环境]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read #  to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Replace obsolete CI runs, but never interrupt a test-machine deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging测试环境' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A failed dependency must fail the required check, not skip it.
    if: ${{ always() }}
    needs:
      - package-arch
    steps:
    - name: Require all build and test jobs to pass
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        results = json.loads(os.environ["NEEDS_JSON"])
        for name, job in results.items():
            print(f"{name}: {job['result']}")
        sys.exit(0 if results and all(
            job["result"] == "success" for job in results.values()
        ) else 1)
        PY

  package-arch:
    name: Debian 13 x86 build
    # Only trusted same-repository PRs may execute on our persistent runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, betterlinuxcnc]
    timeout-minutes: 35
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false
        fetch-depth: 0
        persist-credentials: false
    - name: Build Debian 13 packages in a clean cached container
      env:
        RUN_ACCEPTANCE: >-
          ${{ github.ref == 'refs/heads/staging测试环境' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      run: |
        mode=build
        if [ "$RUN_ACCEPTANCE" = true ]; then mode=test; fi
        .github/ci/run.sh "$mode"
    - name: Upload Debian 13 packages
      uses: actions/upload-artifact@v7
      with:
        name: linuxcnc-trixie-amd64
        path: artifacts/
        if-no-files-found: error

  deploy-staging:
    name: Deploy and test staging
    needs: ci-gate
    if: >-
      github.repository == 'Xamber-Software/BetterLinuxCNC' &&
      github.ref == 'refs/heads/staging测试环境' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: betterlinuxcnc-staging-deploy
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: linuxcnc-trixie-amd64
        path: staging-artifact
    - name: Deploy the tested Debian 13 package through FRP
      env:
        STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        STAGING_HOST: ${{ vars.STAGING_HOST || '45.192.97.209' }}
        STAGING_PORT: ${{ vars.STAGING_PORT || '39011' }}
        STAGING_USER: deploy
      run: .github/staging/deploy.sh staging-artifact
